<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>항공권 예매</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ PAGE 1 : LANDING ============ -->
<section id="page1" class="page active">
  <div class="panel">
    <div id="map1" class="map-big"></div>
    <div class="side-col">
      <div class="box box-blue">
        <p id="flightInfo">지도를 움직여 항공편 정보를 확인하세요.<br>(country, callsign, route)</p>
      </div>
      <button class="btn btn-orange" id="toBooking">항공권 예매</button>
      <button class="btn btn-orange" id="toBrowse">다른 참가자 확인하기</button>
    </div>
  </div>
</section>

<!-- ============ PAGE 2 : BOOKING INFO ============ -->
<section id="page2" class="page">
  <div class="topbar">
    <span class="page-label">BOOKING INFORMATION</span>
    <button class="btn btn-orange small" data-goto="page1">처음으로</button>
  </div>
  <div class="panel two-col">
    <div class="form-col">
      <label>이름</label>
      <input type="text" id="bName" placeholder="이름을 입력하세요">

      <label>FROM</label>
      <select id="bFrom"><option value="">-- 선택 --</option></select>

      <label>TO</label>
      <input list="airportList" id="bTo" placeholder="도시 또는 공항 검색 (기본: Seoul)">
      <datalist id="airportList"></datalist>

      <label>EMAIL</label>
      <input type="email" id="bEmail" placeholder="you@email.com">

      <label class="checkbox-row">
        <input type="checkbox" id="bConsent">
        <span>해당 정보는 작품을 위해서만 활용하며, 작품 운영 기간동안 보관됩니다.</span>
      </label>

      <button class="btn btn-orange" id="toSeats">좌석 선택하기</button>
      <p class="hint" id="bHint"></p>
    </div>
    <div class="map-col">
      <div id="map2" class="map-med"></div>
      <p id="routeInfo" class="route-info">도시를 선택하면 지도에 위치를 표시할 수 있습니다.</p>
    </div>
  </div>
</section>

<!-- ============ PAGE 3 : SEAT SELECTION ============ -->
<section id="page3" class="page">
  <div class="topbar">
    <span class="page-label">SEAT SELECTION</span>
    <button class="btn btn-orange small" data-goto="page1">처음으로</button>
  </div>
  <p class="instruction">좌석을 선택해주세요.</p>
  <div class="panel three-col">
    <div id="seatGrid" class="seat-grid"></div>

    <div class="seat-preview">
      <img src="https://images.unsplash.com/photo-1540339832862-474599807836?w=500&q=80" alt="seat" class="seat-photo">
    </div>

    <div class="seat-form">
      <label>WHEN <span class="hint-inline">(이 날짜에 확인 메일을 전송해드립니다)</span></label>
      <input type="date" id="sDate">

      <label>기내식 선택</label>
      <select id="sMeal">
        <option value="비빔밥">비빔밥</option>
        <option value="파스타">파스타</option>
        <option value="샌드위치">샌드위치</option>
      </select>

      <label>데코 선택</label>
      <select id="sDeco">
        <option value="🌤️ 창가">🌤️ 창가 무드</option>
        <option value="🌙 밤">🌙 밤 비행</option>
        <option value="🌸 봄">🌸 봄 여행</option>
      </select>

      <label>도착지의 나에게 전하고 싶은 말</label>
      <textarea id="sNote" rows="2" placeholder="미래의 나에게..."></textarea>

      <label>상태 메세지 <span class="hint-inline">(다른 사용자들에게 표시됩니다)</span></label>
      <input type="text" id="sStatus" placeholder="예: 설레는 마음으로 떠나요">

      <button class="btn btn-orange" id="toTicket">티켓 확인</button>
      <p class="hint" id="sHint"></p>
    </div>
  </div>
</section>

<!-- ============ PAGE 4 : TICKET CONFIRMATION ============ -->
<section id="page4" class="page">
  <div class="topbar">
    <span class="page-label">TICKET CONFIRMATION & BROWSING</span>
  </div>
  <div class="panel ticket-wrap">
    <div class="ticket" id="ticketCard">
      <div class="ticket-left">
        <p class="tk-label">NAME:</p><p class="tk-val" id="tkName"></p>
        <p class="tk-label">DEP. DATE:</p><p class="tk-val" id="tkDate"></p>
        <button class="chip" id="tkRouteInfoBtn">가는데 드는 시간과 거리</button>
        <p class="tk-val" id="tkFrom"></p>
        <p class="tk-val" id="tkTo"></p>
      </div>
      <div class="ticket-right">
        <p class="bp-title">BOARDING PASS</p>
        <p class="tk-val" id="tkName2"></p>
        <p class="tk-val" id="tkRoute"></p>
        <p class="tk-val" id="tkDate2"></p>
        <p class="tk-val" id="tkSeat"></p>
        <img id="tkQr" class="qr" alt="QR code">
      </div>
    </div>
    <div class="stamp" id="tkStamp"></div>
  </div>
  <div class="panel button-row">
    <button class="btn btn-orange" data-goto="page3fresh">다른 좌석 둘러보기</button>
    <button class="btn btn-orange" data-goto="page1">처음으로</button>
  </div>
</section>

<!-- ============ PAGE 5 : BROWSE OTHER SEATS ============ -->
<section id="page5" class="page">
  <div class="topbar">
    <span class="page-label">SEE OTHER SEATS</span>
  </div>
  <div class="panel three-col">
    <div id="seatGrid5" class="seat-grid"></div>

    <div class="seat-preview">
      <img src="https://images.unsplash.com/photo-1540339832862-474599807836?w=500&q=80" alt="seat" class="seat-photo">
      <div class="ticket small" id="ticket5">
        <p class="placeholder-text">좌석을 선택하면 티켓이 표시됩니다.</p>
      </div>
    </div>

    <div class="seat-form" id="info5">
      <p class="placeholder-text">좌석을 선택하세요.</p>
    </div>
  </div>
  <div class="panel button-row">
    <button class="btn btn-orange" data-goto="page1">처음으로</button>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
